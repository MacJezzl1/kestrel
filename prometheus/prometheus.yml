# Kestrel Core Observability — Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 1. Kestrel Backend Core API Metrics (FastAPI)
  - job_name: 'kestrel-backend'
    scrape_interval: 5s
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['kestrel-api:8000']
        labels:
          app: 'kestrel-core'
          service: 'fastapi'
          environment: 'production'

  # 2. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
