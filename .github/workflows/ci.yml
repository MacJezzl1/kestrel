name: Kestrel DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # =================================================================
  # 1. SECRET SCANNING & SAST AUDIT
  # =================================================================
  security-audit:
    name: Security SAST, Secrets & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Strict Secret Scanning
        run: |
          python scripts/scan_secrets.py

      - name: Install Security Tools
        run: |
          pip install --upgrade pip
          pip install semgrep pip-audit

      - name: SAST Code Security Scan (Semgrep OWASP Top 10)
        run: |
          semgrep --config=p/owasp-top-ten backend/app --error || true

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt || true

  # =================================================================
  # 2. BACKEND TEST SUITE & OBSERVABILITY
  # =================================================================
  backend-test:
    name: Backend Test Suite & Health Validation
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx

      - name: Run Complete Pytest Suite
        run: |
          cd backend
          pytest -v tests/

  # =================================================================
  # 3. FRONTEND BUILD & STATIC PRERENDERING
  # =================================================================
  frontend-build:
    name: Next.js 16 Production Build & Lint
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Production Next.js Bundle
        run: |
          cd frontend
          npm run build

  # =================================================================
  # 4. CONTAINER & DOCKER-COMPOSE SPECIFICATION VALIDATION
  # =================================================================
  docker-validate:
    name: Docker Configuration & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
