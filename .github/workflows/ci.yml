name: Kestrel DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # =================================================================
  # 1. SECURITY AUDIT & SAST SCANNING
  # =================================================================
  security-audit:
    name: Security SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Tools
        run: |
          pip install --upgrade pip
          pip install semgrep pip-audit

      - name: SAST Code Security Scan (Semgrep OWASP Top 10)
        run: |
          semgrep --config=p/owasp-top-ten backend/app --error || true

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt || true

  # =================================================================
  # 2. BACKEND TEST SUITE & LINTING
  # =================================================================
  backend-test:
    name: Backend Test Suite & Type Check
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Run Backend Tests
        run: |
          cd backend
          pytest -v tests/

  # =================================================================
  # 3. FRONTEND BUILD & STATIC ANALYSIS
  # =================================================================
  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Production Next.js Bundle
        run: |
          cd frontend
          npm run build
