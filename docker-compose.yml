version: '3.8'

services:
  # 1. Kestrel Web API (FastAPI Backend)
  kestrel-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kestrel_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - MT5_RPC_URL=http://kestrel-mt5:5001
      - MT5_BRIDGE_SECRET=kestrel-internal-rpc-secret-token
      - REDIS_URL=redis://kestrel-redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - PROMETHEUS_ENABLED=true
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - kestrel-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kestrel-internal

  # 2. MetaTrader 5 Headless Container Service
  kestrel-mt5:
    build:
      context: ./docker/mt5
      dockerfile: Dockerfile
    container_name: kestrel_mt5
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "5900:5900" # VNC port for terminal inspection
    environment:
      - MT5_BRIDGE_SECRET=kestrel-internal-rpc-secret-token
    networks:
      - kestrel-internal

  # 3. Kestrel Modern Next.js Frontend
  kestrel-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kestrel_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - kestrel-api
    networks:
      - kestrel-internal

  # 4. Redis Event Bus & Order Execution Queue
  kestrel-redis:
    image: redis:7-alpine
    container_name: kestrel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - kestrel-internal

  # 5. Prometheus Metrics Aggregator
  kestrel-prometheus:
    image: prom/prometheus:v2.50.0
    container_name: kestrel_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - kestrel-api
    networks:
      - kestrel-internal

  # 6. Grafana Observability Dashboards
  kestrel-grafana:
    image: grafana/grafana:10.3.0
    container_name: kestrel_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - kestrel-prometheus
    networks:
      - kestrel-internal

networks:
  kestrel-internal:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
